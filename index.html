<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="logo2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Control de Ofertas</title>
    <link rel="stylesheet" href="style.css">
    <!-- LIBRERÍA DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-wrapper">
        <!-- LOGO ARRIBA DE LA TARJETA -->
        <div class="login-logo">
            <img src="logo_index.png" alt="Logo APPAREIL">
        </div>

        <!-- TARJETA DE LOGIN -->
        <div class="login-container">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <!-- Grupo de Usuario -->
                <div class="input-group">
                    <label for="username">Correo Electrónico</label>
                    <input type="email" id="username" name="username" placeholder="Ej: alopez@appareil.cl" required>
                </div>
                
                <!-- Grupo de Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <!-- Recordarme y Olvidé Contraseña -->
                <div class="actions">
                    <label>
                        <input type="checkbox" name="remember"> Recordarme
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de Entrada -->
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE CONEXIÓN CON SUPABASE -->
    <script>
        // CREDENCIALES REALES DE TU PROYECTO APPAREIL
        const SUPABASE_URL = 'https://qboawjjuzgijgtyjzqiw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HAuwDGL-5bWi5E2GHUBUKA_euUS1ig7';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("username").value.trim().toLowerCase();
            const password = document.getElementById("password").value.trim();
            const btnSubmit = document.querySelector(".btn-submit");

            // Validación de correo corporativo
            if (!email.endsWith("@appareil.cl")) {
                alert("Acceso denegado. Debes ingresar con un correo corporativo (@appareil.cl).");
                return;
            }

            // Mostrar que está cargando
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Validando...";

            try {
                // Autenticar con Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    alert("Correo o contraseña incorrectos. Verifica e intenta de nuevo.");
                    console.error("Error de Supabase:", error.message);
                } else {
                    // Éxito: Guardar sesión y redirigir
                    localStorage.setItem("logged_in", "true");
                    localStorage.setItem("user_email", data.user.email);
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                alert("Ocurrió un error de conexión.");
                console.error(err);
            } finally {
                // Restaurar el botón si hay error
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Ingresar";
            }
        });
    </script>
</body>
</html>
